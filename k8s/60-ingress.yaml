# Public entry (D2): https://saas.koyad.com → web ; /api → API (mobile app) ; /mail → demo inbox. HTTP → HTTPS.
# The certificate comes from Let's Encrypt through the Traefik of k3s (resolver « letsencrypt », HTTP challenge).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: https, namespace: launchkit }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Browsers come back in HTTPS only, for a year (HSTS), on every route (web, API, inbox).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: security, namespace: launchkit }
spec:
  headers: { stsSeconds: 31536000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-https
  namespace: launchkit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: launchkit-security@kubernetescrd
spec:
  rules:
    - host: saas.koyad.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8080 } } } }
          - { path: /mail, pathType: Prefix, backend: { service: { name: mailpit, port: { number: 8025 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-http
  namespace: launchkit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: launchkit-https@kubernetescrd
spec:
  rules:
    - host: saas.koyad.com
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }] }
